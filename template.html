<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AI 新聞看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 科技風深色主題（參考 Raycast：近黑底、紅色斜向光暈、毛玻璃、發光邊框） */
:root {
  --bg: #07080a; --ink: #f4f4f5; --muted: #8b8d98; --dim: #5d5f69;
  --line: rgba(255, 255, 255, .08); --line-strong: rgba(255, 255, 255, .16);
  --glass: rgba(22, 23, 27, .62); --surface: rgba(255, 255, 255, .035);
  --red: #ff4d4d; --red-soft: rgba(255, 77, 77, .14);
  --hot: #ff6363;
  /* 各公司識別色：彼此色相拉開，卡片、標籤、篩選鈕共用 */
  --c-OpenAI: #3ee0b0; --c-Anthropic: #ff8a5c; --c-Google: #5b9dff; --c-Meta: #b18cff;
  --c-Microsoft: #ffcc40; --c-NVIDIA: #8ee03a; --c-xAI: #e4e4e7;
  --sans: "Inter", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: transparent; color: var(--ink); min-height: 100vh;  /* 底色由 html 提供，光暈層才不會被蓋住 */
  font: 15px/1.65 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
a { color: inherit; }
::selection { background: rgba(255, 77, 77, .35); }

/* 背景光暈：斜向紅色條紋＋淡淡的藍紫色光 */
.glow { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.glow::before {
  content: ""; position: absolute; left: 50%; top: -170px; width: 1100px; height: 700px;
  transform: translateX(-50%) rotate(-8deg);
  background: repeating-linear-gradient(135deg,
    transparent 0 46px, rgba(255, 45, 70, .75) 46px 100px, transparent 100px 150px,
    rgba(255, 70, 70, .45) 150px 186px, transparent 186px 240px);
  -webkit-mask-image: radial-gradient(ellipse 50% 55% at 50% 45%, #000 20%, transparent 72%);
  mask-image: radial-gradient(ellipse 50% 55% at 50% 45%, #000 20%, transparent 72%);
  filter: blur(22px); opacity: .72;
}
.glow::after {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(600px 380px at 12% 8%, rgba(90, 110, 255, .10), transparent 70%),
    radial-gradient(520px 360px at 92% 18%, rgba(170, 80, 255, .08), transparent 70%),
    linear-gradient(to bottom, transparent 0, var(--bg) 620px);
}

.wrap { max-width: 940px; margin: 0 auto; padding: 0 16px; }

/* 浮動毛玻璃導覽列 */
.nav {
  position: sticky; top: 12px; z-index: 10; margin-top: 12px;
  display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px;
  background: var(--glass); border: 1px solid var(--line); border-radius: 16px;
  -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
  box-shadow: 0 10px 40px -12px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .05);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; }
.logo {
  width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  background: linear-gradient(135deg, #ff6a5a, #e0203c); box-shadow: 0 0 18px -2px rgba(255, 60, 60, .7);
  font: 700 12px/1 var(--mono); color: #fff;
}
.spacer { flex: 1; }
button {
  font: inherit; cursor: pointer; color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; transition: .15s;
}
button:hover { border-color: var(--line-strong); background: rgba(255, 255, 255, .04); }
button:focus-visible, input:focus-visible { outline: 2px solid rgba(255, 99, 99, .6); outline-offset: 2px; }
button.primary {
  background: #f4f4f5; color: #0b0b0d; border-color: #f4f4f5; font-weight: 600;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .1), 0 6px 20px -6px rgba(255, 255, 255, .35);
}
button.primary:hover { background: #fff; }
button:disabled { opacity: .55; cursor: progress; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 10px; }
.seg button { border: 0; border-radius: 7px; padding: 3px 10px; font-size: 13px; color: var(--muted); }
.seg button.on { background: rgba(255, 255, 255, .1); color: var(--ink); }

/* 主視覺 */
.hero { text-align: center; padding: 64px 0 28px; }
.badge {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px;
  font: 500 12px/1.6 var(--mono); color: #ffd2d2; background: rgba(255, 60, 60, .08);
  border: 1px solid rgba(255, 90, 90, .35); box-shadow: 0 0 20px -4px rgba(255, 60, 60, .45);
}
.badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); }
h1 {
  margin: 18px 0 8px; font-size: clamp(34px, 7vw, 60px); line-height: 1.08; font-weight: 700;
  letter-spacing: -.035em;
  background: linear-gradient(180deg, #fff 30%, rgba(255, 255, 255, .55));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.meta { color: var(--muted); font: 13px/1.6 var(--mono); }

/* 類 Raycast 指令列的搜尋框 */
.search {
  position: relative; margin: 8px auto 0; max-width: 640px;
}
.search svg { position: absolute; left: 16px; top: 50%; translate: 0 -50%; color: var(--dim); }
input[type=search] {
  font: 16px var(--sans); width: 100%; padding: 14px 52px 14px 46px; border-radius: 14px;
  color: var(--ink); background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: 0 20px 50px -20px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .05);
}
input[type=search]::placeholder { color: var(--dim); }
input[type=search]:focus { border-color: rgba(255, 99, 99, .5); outline: none; box-shadow: 0 0 0 4px rgba(255, 77, 77, .12); }
kbd {
  position: absolute; right: 14px; top: 50%; translate: 0 -50%; font: 12px var(--mono); color: var(--muted);
  border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 6px; padding: 0 7px;
}

.controls { display: grid; gap: 10px; margin: 26px 0 6px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row .lbl { color: var(--dim); font: 12px var(--mono); text-transform: uppercase; width: 44px; flex-shrink: 0; }
.chip { border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--muted); }
.chip.on { background: #f4f4f5; border-color: #f4f4f5; color: #0b0b0d; font-weight: 600; }
.chip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 6px currentColor; }

.notice {
  margin: 16px 0 0; padding: 10px 14px; border-radius: 12px; font-size: 14px;
  background: var(--red-soft); border: 1px solid rgba(255, 90, 90, .3); color: #ffd9d9;
}
.notice:empty { display: none; }
.stats { color: var(--dim); font: 12px var(--mono); margin: 18px 0 10px; }

/* 新聞卡片 */
.card {
  position: relative; padding: 16px 18px; margin-bottom: 10px; border-radius: 16px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, .015));
  border: 1px solid var(--line); transition: border-color .2s, transform .2s, box-shadow .2s;
}
.card:hover { border-color: var(--line-strong); transform: translateY(-1px); box-shadow: 0 16px 40px -20px rgba(0, 0, 0, .9); }
/* 有主角公司的卡片：整張帶公司色（左側發光色條、左上角色光、邊框） */
.card.co {
  padding-left: 22px;
  background:
    radial-gradient(420px 160px at 0% 0%, color-mix(in srgb, var(--cc) 16%, transparent), transparent 70%),
    linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .012));
  border-color: color-mix(in srgb, var(--cc) 26%, transparent);
}
.card.co::before {
  content: ""; position: absolute; left: -1px; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0;
  background: var(--cc); box-shadow: 0 0 14px var(--cc);
}
.card.co:hover { border-color: color-mix(in srgb, var(--cc) 50%, transparent); }
/* 多家報導：公司色的光暈更強 */
.card.co.hot { box-shadow: 0 0 40px -16px var(--cc); border-color: color-mix(in srgb, var(--cc) 40%, transparent); }
.card.hot:not(.co) { border-color: rgba(255, 90, 90, .3); box-shadow: 0 0 36px -16px rgba(255, 60, 60, .5); }
.cohead { display: flex; align-items: center; gap: 10px; margin-right: 4px; }
.mono {
  width: 30px; height: 30px; flex-shrink: 0; border-radius: 9px; display: grid; place-items: center;
  font: 700 12px/1 var(--mono); color: #0b0b0d; background: var(--cc);
  box-shadow: 0 0 16px -3px var(--cc), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.coname { font-weight: 700; font-size: 14px; color: var(--cc); letter-spacing: .01em; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px/1.9 var(--mono);
  padding: 0 9px; border-radius: 999px; background: color-mix(in srgb, currentColor 12%, transparent);
}
.tag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
.heat {
  margin-left: auto; font: 600 11.5px/1.9 var(--mono); color: #ffd0d0; white-space: nowrap;
  padding: 0 9px; border-radius: 999px; background: rgba(255, 60, 60, .14); border: 1px solid rgba(255, 90, 90, .35);
}
.card h2 { font-size: 17px; line-height: 1.5; margin: 2px 0; font-weight: 600; letter-spacing: -.005em; }
.card h2 a { text-decoration: none; }
.card h2 a:hover { color: #fff; text-decoration: underline; text-decoration-color: rgba(255, 99, 99, .7); text-underline-offset: 3px; }
.orig { color: var(--muted); font-size: 13px; margin: 0 0 4px; }
.sum { margin: 6px 0; font-size: 14px; color: #b9bbc6; }
.src { font: 12px/1.8 var(--mono); color: var(--dim); }
.src b { color: #d4d5dc; font-weight: 500; }
.kind { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); margin-left: 6px; color: var(--muted); }
details { margin-top: 10px; font-size: 14px; border-top: 1px dashed var(--line); padding-top: 8px; }
summary { cursor: pointer; color: var(--muted); font: 12px var(--mono); }
summary:hover { color: var(--ink); }
details ul { margin: 6px 0 0; padding-left: 18px; color: #c4c6cf; }
details li { margin: 5px 0; }
details li::marker { color: var(--red); }
.empty { text-align: center; color: var(--muted); padding: 60px 0; }
footer { color: var(--dim); font: 12px/1.7 var(--mono); padding: 28px 0 48px; border-top: 1px solid var(--line); margin-top: 28px; }
footer table { border-collapse: collapse; margin-top: 8px; }
footer td { padding: 2px 14px 2px 0; }
.bad { color: var(--red); }
@media (max-width: 600px) {
  .nav { top: 8px; flex-wrap: wrap; }
  .brand span { display: none; }
  .hero { padding: 40px 0 20px; }
  .row .lbl { width: 100%; }
  kbd { display: none; }
  .card { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="wrap">
  <nav class="nav">
    <div class="brand"><div class="logo">AI</div><span>AI 新聞看板</span></div>
    <div class="spacer"></div>
    <div class="seg" id="lang">
      <button data-v="zh">中文</button><button data-v="en">原文</button>
    </div>
    <button class="primary" id="refresh">↻ 立即更新</button>
  </nav>
</div>
<main class="wrap">
  <section class="hero">
    <span class="badge"><i></i>LIVE · 每日 08:00 自動更新</span>
    <h1>AI 產業焦點</h1>
    <div class="meta" id="meta"></div>
  </section>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="q" placeholder="搜尋標題或摘要（中英文皆可）" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <div class="notice" id="notice"></div>
  <div class="controls">
    <div class="row" id="f-company"><span class="lbl">公司</span></div>
    <div class="row" id="f-kind"><span class="lbl">來源</span></div>
    <div class="row" id="f-range"><span class="lbl">時間</span></div>
    <div class="row" id="f-sort"><span class="lbl">排序</span></div>
  </div>
  <div class="stats" id="stats"></div>
  <div id="list"></div>
  <footer id="foot"></footer>
</main>
<script>
const DATA = /*__DATA__*/null;
const CFG = /*__CFG__*/{};
const KIND = { official: "官方", wire: "國際財經", tech: "科技媒體" };
const MONO = { OpenAI: "OA", Anthropic: "AN", Google: "G", Meta: "M", Microsoft: "MS", NVIDIA: "NV", xAI: "xAI" };
// 本機伺服器才能直接更新；雲端版改成連到 GitHub Actions 手動執行頁
const LIVE = ["127.0.0.1", "localhost"].includes(location.hostname);

function load(k, d) { try { return localStorage.getItem("ainews." + k) || d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem("ainews." + k, v); } catch (e) {} }

const state = {
  lang: load("lang", "zh"), company: load("company", "all"), kind: load("kind", "all"),
  range: load("range", "7"), sort: load("sort", "hot"), q: ""
};

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v; else if (k === "style") n.style.cssText = v; else n.setAttribute(k, v);
  }
  for (const c of kids) if (c != null && c !== false) n.append(c);
  return n;
}
const safe = u => /^https?:\/\//i.test(u) ? u : "#";
function ago(iso) {
  const m = (Date.now() - new Date(iso)) / 60000;
  if (m < 60) return Math.max(1, Math.round(m)) + " 分鐘前";
  if (m < 1440) return Math.round(m / 60) + " 小時前";
  return Math.round(m / 1440) + " 天前";
}
const fmt = iso => new Date(iso).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
const T = it => state.lang === "zh" && it.title_zh ? it.title_zh : it.title;
const S = it => state.lang === "zh" && it.summary_zh ? it.summary_zh : it.summary;

function chips(id, key, opts) {
  const row = document.getElementById(id);
  row.querySelectorAll("button").forEach(b => b.remove());
  for (const [v, label] of opts) {
    const dot = key === "company" && v !== "all" ? el("span", { class: "dot", style: `background:var(--c-${v});color:var(--c-${v})` }) : null;
    const b = el("button", { class: "chip" + (state[key] === v ? " on" : "") }, dot, label);
    b.onclick = () => { state[key] = v; save(key, v); drawControls(); draw(); };
    row.append(b);
  }
}
function drawControls() {
  chips("f-company", "company", [["all", "全部"], ...CFG.companies.map(c => [c, c])]);
  chips("f-kind", "kind", [["all", "全部"], ["official", "官方發布"], ["wire", "國際財經媒體"], ["tech", "科技媒體"]]);
  chips("f-range", "range", [["1", "24 小時"], ["3", "3 天"], ["7", "7 天"]]);
  chips("f-sort", "sort", [["hot", "熱門（多家報導優先）"], ["new", "最新"]]);
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.v === state.lang));
}

function match(c) {
  if (state.company !== "all" && !c.companies.includes(state.company)) return false;
  if (state.kind !== "all" && !c.items.some(i => i.kind === state.kind)) return false;
  if (Date.now() - new Date(c.date) > +state.range * 86400000) return false;
  if (state.q) {
    const q = state.q.toLowerCase();
    return c.items.some(i => [i.title, i.title_zh, i.summary, i.summary_zh].some(s => s && s.toLowerCase().includes(q)));
  }
  return true;
}

function card(c) {
  const [lead, ...rest] = c.items;
  // 主角公司：大色塊縮寫＋公司名；其他提到的公司縮成小標籤
  const primary = c.primary || null;
  const others = c.companies.filter(n => n !== primary);
  const tags = el("div", { class: "tags" },
    primary ? el("div", { class: "cohead" }, el("span", { class: "mono" }, MONO[primary] || primary[0]), el("span", { class: "coname" }, primary)) : null,
    ...others.map(n => el("span", { class: "tag", style: `color:var(--c-${n})` }, n)),
    c.n_sources > 1 ? el("span", { class: "heat" }, `🔥 ${c.n_sources} 家報導`) : null);
  const title = el("h2", {}, el("a", { href: safe(lead.link), target: "_blank", rel: "noopener noreferrer" }, T(lead)));
  const orig = state.lang === "zh" && lead.title_zh ? el("p", { class: "orig" }, lead.title) : null;
  const sum = S(lead) ? el("p", { class: "sum" }, S(lead)) : null;
  const src = el("div", { class: "src" }, el("b", {}, lead.source), el("span", { class: "kind" }, KIND[lead.kind]),
    ` · ${ago(lead.date)}（${fmt(lead.date)}）`);
  let more = null;
  if (rest.length) {
    more = el("details", {}, el("summary", {}, `其他 ${rest.length} 則相關報導`),
      el("ul", {}, ...rest.map(i => el("li", {},
        el("b", {}, i.source), "：",
        el("a", { href: safe(i.link), target: "_blank", rel: "noopener noreferrer" }, T(i)),
        el("span", { class: "src" }, ` · ${ago(i.date)}`)))));
  }
  const cls = "card" + (primary ? " co" : "") + (c.n_sources > 1 ? " hot" : "");
  return el("article", { class: cls, style: primary ? `--cc:var(--c-${primary})` : "" }, tags, title, orig, sum, src, more);
}

function draw() {
  const list = document.getElementById("list");
  list.replaceChildren();
  if (!DATA) {
    list.append(el("div", { class: "empty" }, LIVE ? "第一次使用，正在抓取新聞…（約 1 分鐘）" : "尚無資料，請用桌面捷徑開啟並按「立即更新」。"));
    return;
  }
  let cs = DATA.clusters.filter(match);
  if (state.sort === "hot") cs = [...cs].sort((a, b) => b.n_sources - a.n_sources || new Date(b.date) - new Date(a.date));
  const hot = cs.filter(c => c.n_sources > 1).length;
  document.getElementById("stats").textContent = `共 ${cs.length} 個事件，其中 ${hot} 個有多家媒體報導`;
  if (!cs.length) list.append(el("div", { class: "empty" }, "沒有符合條件的新聞"));
  const frag = document.createDocumentFragment();
  cs.forEach(c => frag.append(card(c)));
  list.append(frag);
}

function drawMeta() {
  const meta = document.getElementById("meta");
  const foot = document.getElementById("foot");
  if (!DATA) { meta.textContent = "尚未更新"; return; }
  meta.textContent = `國外權威媒體 · 近 ${DATA.days} 天 · 最後更新 ${fmt(DATA.generated)}（${ago(DATA.generated)}）`;
  const bad = DATA.feeds.filter(f => f.error);
  foot.replaceChildren(
    el("div", {}, `來源狀態：${DATA.feeds.length - bad.length}/${DATA.feeds.length} 正常。翻譯使用 Google 翻譯免費服務，不消耗 AI token。`),
    el("table", {}, ...DATA.feeds.map(f => el("tr", {},
      el("td", {}, f.name), el("td", {}, KIND[f.kind]),
      el("td", { class: f.error ? "bad" : "" }, f.error ? "抓取失敗" : `${f.count} 則`)))));
}

async function refresh() {
  const btn = document.getElementById("refresh");
  const notice = document.getElementById("notice");
  if (!LIVE && CFG.runUrl) {
    window.open(CFG.runUrl, "_blank", "noopener");
    notice.textContent = "已開啟 GitHub：請按右側「Run workflow」→ 綠色「Run workflow」，約 1–2 分鐘後重新整理本頁即可看到新資料。";
    return;
  }
  if (!LIVE) {
    notice.textContent = "這是離線檔案，無法更新。請用桌面上的「AI 新聞看板」捷徑開啟，就能使用「立即更新」。";
    return;
  }
  btn.disabled = true; btn.textContent = "更新中…";
  notice.textContent = "正在抓取各家媒體並翻譯，通常 10–60 秒。";
  try {
    const r = await fetch("/refresh", { method: "POST", headers: { "X-AI-News": "1" } });
    if (!r.ok) throw new Error(r.status);
    location.reload();
  } catch (e) {
    btn.disabled = false; btn.textContent = "↻ 立即更新";
    notice.textContent = "更新失敗：看板程式可能已關閉，請重新點桌面上的「AI 新聞看板」捷徑。";
  }
}

document.getElementById("refresh").onclick = refresh;
document.querySelectorAll("#lang button").forEach(b => b.onclick = () => {
  state.lang = b.dataset.v; save("lang", state.lang); drawControls(); draw();
});
document.getElementById("q").oninput = e => { state.q = e.target.value.trim(); draw(); };
// 按「/」直接跳到搜尋框（仿 Raycast 指令列）
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); document.getElementById("q").focus(); }
});
drawControls(); drawMeta(); draw();
if (LIVE && (!DATA || Date.now() - new Date(DATA.generated) > CFG.staleHours * 3600000)) refresh();
</script>
</body>
</html>
